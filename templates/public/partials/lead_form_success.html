<div id="lead-form-wrapper" class="rounded-md border border-green-200 bg-green-50 p-6 text-center">
    <p class="font-medium text-green-800">Recebemos seus dados! Em breve um consultor entrará em contato.</p>
    {% if whatsapp_url %}
    <a href="{{ whatsapp_url }}" target="_blank" rel="noopener"
       style="display:inline-block;margin-top:12px;padding:10px 18px;border-radius:6px;background:#25D366;color:#fff;font-weight:600;text-decoration:none">
        Abrir conversa no WhatsApp
    </a>
    {% endif %}
</div>
{% if landing_page.facebook_pixel_id %}
<script>if (window.fbq) { fbq('track', 'Lead', {}, {eventID: '{{ lead.id }}'}); }</script>
{% endif %}
{% if landing_page.google_ads_id %}
<script>if (window.gtag) { gtag('event', 'conversion', {'send_to': '{{ landing_page.google_ads_id }}'}); }</script>
{% endif %}
{% if whatsapp_url %}
<script>
/* Abre o WhatsApp numa aba nova, mantendo a página aberta. O clique em
   "Enviar" ainda vale como gesto do usuário poucos segundos depois, mas
   alguns navegadores (Safari/iOS) bloqueiam a aba fora do clique: aí
   window.open devolve null e o visitante vai na mesma aba, como antes. */
setTimeout(function () {
    var url = '{{ whatsapp_url|escapejs }}';
    var tab = window.open(url, '_blank');
    if (tab) {
        tab.opener = null;
    } else {
        window.location.href = url;
    }
}, 600);
</script>
{% endif %}
