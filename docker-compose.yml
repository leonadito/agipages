services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
      - media_data:/app/media
      # tenants/traefik.py writes traefik/dynamic/tenants.yml relative to
      # BASE_DIR (/app here) — without this bind mount that write lands
      # inside the container's own throwaway layer, never reaching the
      # host path the standalone Traefik service (own project/repo at
      # /var/www/traefik/, see its docker-compose.yml) actually reads from.
      - /var/www/traefik/dynamic:/app/traefik/dynamic
    ports:
      # Bound to localhost only — Traefik (separate compose project at
      # /var/www/traefik/, network_mode: host) reaches this exactly like
      # the host's nginx used to, via loopback.
      - "127.0.0.1:8002:8000"
    restart: unless-stopped

volumes:
  # SQLite file and uploaded media both need to survive rebuilds/
  # redeploys — the container filesystem itself is ephemeral (PRD §9/§10).
  sqlite_data:
  media_data:
