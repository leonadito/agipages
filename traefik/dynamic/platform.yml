# Static dynamic-config file (tracked in git, NOT regenerated). Defines
# every service/router that ISN'T a tenant custom domain:
#   - the agipages platform domain itself (service "web", also the name
#     tenants/traefik.py hardcodes for every generated tenant router —
#     don't rename it, see tenants/tests.py::test_verified_tenant_gets_http_and_https_routers)
#   - the other two apps this VPS hosts (agitare, metaleads), previously
#     served by host nginx directly — moved here as part of the nginx ->
#     Traefik migration so a single process owns ports 80/443
#   - a shared "internal-static" service: nginx repurposed as an
#     internal-only (127.0.0.1:8080) backend that still serves /static/
#     and /media/ via the exact alias blocks it always had, just no
#     longer terminating TLS or owning 80/443 itself
# traefik/dynamic/tenants.yml (generated by tenants/traefik.py, gitignored)
# only adds Host-only routers referencing the "web" service below.
http:
  routers:
    platform-websecure:
      rule: "Host(`agipages.agitare.com.br`)"
      service: web
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    platform-web:
      rule: "Host(`agipages.agitare.com.br`)"
      service: web
      entryPoints:
        - web

    agitare-websecure:
      rule: "Host(`agitare.com.br`) || Host(`www.agitare.com.br`)"
      service: agitare
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: "agitare.com.br"
            sans:
              - "www.agitare.com.br"
    agitare-web:
      rule: "Host(`agitare.com.br`) || Host(`www.agitare.com.br`)"
      service: agitare
      entryPoints:
        - web

    metaleads-websecure:
      rule: "Host(`metaleads.agitare.com.br`)"
      service: metaleads
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    metaleads-web:
      rule: "Host(`metaleads.agitare.com.br`)"
      service: metaleads
      entryPoints:
        - web

    # www.albertokappel.com.br only ever redirects to the apex (set up
    # manually when this tenant was onboarded). Tenant.custom_domain has
    # no "www variant" concept, so the apex itself gets its router from
    # the generated tenants.yml, and this redirect is pinned here by hand.
    # Any future self-service tenant wanting a working www needs the same
    # kind of manual addition until the data model supports it.
    albertokappel-www-websecure:
      rule: "Host(`www.albertokappel.com.br`)"
      service: web
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - albertokappel-www-to-apex
    albertokappel-www-web:
      rule: "Host(`www.albertokappel.com.br`)"
      service: web
      entryPoints:
        - web
      middlewares:
        - albertokappel-www-to-apex

    # Static/media: path-prefix routers must win over the Host-only
    # catch-alls above, hence the explicit higher priority.
    agipages-media-websecure:
      rule: "Host(`agipages.agitare.com.br`) && PathPrefix(`/media/`)"
      service: internal-static
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 100
    agipages-media-web:
      rule: "Host(`agipages.agitare.com.br`) && PathPrefix(`/media/`)"
      service: internal-static
      entryPoints:
        - web
      priority: 100
    albertokappel-media-websecure:
      rule: "Host(`albertokappel.com.br`) && PathPrefix(`/media/`)"
      service: internal-static
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 100
    albertokappel-media-web:
      rule: "Host(`albertokappel.com.br`) && PathPrefix(`/media/`)"
      service: internal-static
      entryPoints:
        - web
      priority: 100
    agitare-static-websecure:
      rule: "(Host(`agitare.com.br`) || Host(`www.agitare.com.br`)) && PathPrefix(`/static/`)"
      service: internal-static
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 100
    agitare-static-web:
      rule: "(Host(`agitare.com.br`) || Host(`www.agitare.com.br`)) && PathPrefix(`/static/`)"
      service: internal-static
      entryPoints:
        - web
      priority: 100
    metaleads-static-websecure:
      rule: "Host(`metaleads.agitare.com.br`) && PathPrefix(`/static/`)"
      service: internal-static
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 100
    metaleads-static-web:
      rule: "Host(`metaleads.agitare.com.br`) && PathPrefix(`/static/`)"
      service: internal-static
      entryPoints:
        - web
      priority: 100

  middlewares:
    albertokappel-www-to-apex:
      redirectRegex:
        regex: "^https?://www\\.albertokappel\\.com\\.br/(.*)"
        replacement: "https://albertokappel.com.br/${1}"
        permanent: true

  services:
    web:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8002"
    agitare:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8001"
    metaleads:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"
    internal-static:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
